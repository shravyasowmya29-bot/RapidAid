name: rapid_aid
description: "RapidAid - Accessible AI First-Response Emergency Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8

  # Networking & Emergency Call Handling
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Location Services
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/